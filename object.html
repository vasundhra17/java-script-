<!DOCTYPE html>
<html lang="en">
<head>
    <title>objects in java script</title>
</head>
<body>
    <script>
        let product = {
            company : 'Mango',
            price: 861,
            'item-name' : 'T-shirt',
            displayPrice: function(){
                console.log(`Price of the product is ${this.price}`)
            }
        };
        product.displayPrice();

    </script>
</body>
</html>
